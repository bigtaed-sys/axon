<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:*; img-src 'self' data: blob: http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; font-src 'self' data:"
    />
    <!--
      Внешних адресов в img-src нет намеренно. Агент читает чужие страницы и
      файлы, и картинка по чужой ссылке в его ответе — готовый маячок: она
      сообщит отправителю, что текст прочитали, вместе с IP. Такие картинки
      показываются карточкой и открываются в браузере по явному нажатию.
      blob: и data: — это уже наши байты, из вложений и из ядра.
    -->
    <title>Axon</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
