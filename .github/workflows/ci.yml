# Проверки: типы и тесты. Ровно то же, что делает `npm run check` на своей
# машине, — смысл не поймать что-то новое, а не дать забыть.
#
# Запускается только руками, и это не выбор из соображений экономии: Actions
# этому репозиторию недоступны, задания не стартуют вовсе.
#
# На автоматическом запуске каждый push и каждый чужой pull request получал бы
# красный крест, не имеющий отношения к коду. Человек, впервые открывший
# репозиторий, прочитает это как «проект сломан» — пусто честнее. Проверки
# живут в `npm run check`, а файл дождётся своего часа.
name: Проверки

on:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Версия берётся из git-тега (scripts/version.mjs), а мелкая выкачка
          # тегов не приносит: сборка получилась бы «0.0.0-dev».
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # node:sqlite появился в 22.5 — на более старом ядро не поднимется.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Типы
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Клиент
        run: npm run typecheck --workspace @axon/desktop
